apply plugin: "com.android.application"
apply plugin: "kotlin-android" // Mantemos o Kotlin
apply plugin: "com.google.gms.google-services" // Adicionado para o Firebase

// Esta é a linha mais importante. Ela aplica a configuração do React Native.
apply from: new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../react.gradle")

android {
    namespace "com.brunof3l.locus" // Use o seu namespace
    compileSdkVersion 34 // Use a SDK 34 (ou a que estava no seu original)
    defaultConfig {
        applicationId "com.brunof3l.locus" // Use o seu ID
        minSdkVersion 23 // Use o seu minSdkVersion
        targetSdkVersion 34 // Use o seu targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Você pode adicionar sua config de release aqui depois
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug // Mude para sua
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        // Evita conflitos de bibliotecas
        pickFirst "**/libhermes.so"
        pickFirst "**/libfbjni.so"
        // Adicione outras se houver mais conflitos
    }
}

dependencies {
    // Dependências nativas do Android (mínimas)
    implementation "com.facebook.soloader:soloader:0.10.5"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.3.1')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'

    // Dependências do React Native (O QUE FALTAVA)
    implementation "com.facebook.react:react-native:+" // Puxa a versão do package.json
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.10" // Versão do Kotlin
    implementation 'com.facebook.fbjni:fbjni:0.3.0'

    // Dependências do Expo
    implementation project(':expo')
    implementation project(':expo-modules-core')
    implementation project(':expo-app-loading')
    implementation project(':expo-constants')
    implementation project(':expo-file-system')
    implementation project(':expo-font')
    // Adicione todos os outros pacotes do Expo que você usa (ex: expo-camera)
    // implementation project(':expo-camera')
    
    // Hermes
    def hermesPath = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../../android")
    debugImplementation files(new File(hermesPath, "hermes-debug.aar"))
    releaseImplementation files(new File(hermesPath, "hermes-release.aar"))
    
    // Flipper (para debug)
    if (findProject(':react-native-flipper')) {
        implementation project(':react-native-flipper')
    }
}